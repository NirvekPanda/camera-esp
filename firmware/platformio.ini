[env:xiao_esp32s3]
platform = espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  ; Log output would corrupt the binary protocol on the shared USB port.
  -DCORE_DEBUG_LEVEL=0
; Copies a merged flash image + manifest into web/public/firmware/ for WebSerial flashing.
extra_scripts = post:scripts/export_web.py
