# Template: start.sh fills in __PORT__ and __ROOT__ and installs it.
# Cloudflare Tunnel: camera.nirvek.xyz → http://<host>:__PORT__ (HTTPS ends at Cloudflare).
server {
    listen __PORT__ default_server;
    listen [::]:__PORT__ default_server;
    server_name _;
    root __ROOT__;
    index index.html;
    absolute_redirect off; # keep :__PORT__ out of redirects behind the tunnel
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always; # content-hashed
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
